<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --abn-navy:      #004974;
    --abn-teal:      #1B93A5;
    --abn-cyan:      #00C7E5;
    --abn-light-cyan:#AFF4FF;
    --abn-pale-teal: #AFDCDF;
    --abn-steel:     #86BCBF;
    --abn-muted:     #6499A2;
    --abn-gray:      #BFBFBF;
    --abn-white:     #FFFFFF;
    --abn-gradient:  linear-gradient(135deg, #004974 0%, #1B93A5 55%, #00C7E5 100%);
    --font-heading:  'Montserrat', sans-serif;
    --font-body:     'Inter', sans-serif;

    /* Pipeline temperature scale: 0 = hottest / most urgent cadence, 4 = coldest / slow nurture */
    --phase-0: #00A9C4;
    --phase-1: #147C8E;
    --phase-2: #5C9194;
    --phase-3: #4A7480;
    --phase-4: #8D8D8D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f5f9fb; }
  body {
    font-family: var(--font-body);
    font-weight: 300;
    color: var(--abn-navy);
    min-height: 100vh;
  }

  /* ---------- Hero ---------- */
  .hero {
    background: var(--abn-gradient);
    color: white;
    padding: 30px 48px 28px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    right: -90px; top: -90px;
    width: 380px; height: 380px;
    border: 8px solid rgba(255,255,255,0.12);
    transform: rotate(45deg);
  }
  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
    gap: 16px;
  }
  .logo-img { height: 40px; display: block; }

  .sync {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-heading); font-size: 11px; letter-spacing: 1px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 8px 14px;
    border-radius: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--abn-cyan); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(0,199,229,0.7);} 70%{box-shadow:0 0 0 7px rgba(0,199,229,0);} 100%{box-shadow:0 0 0 0 rgba(0,199,229,0);} }
  .sync button {
    background: transparent; border: 1px solid rgba(255,255,255,0.5); color: white;
    font-family: var(--font-heading); font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 10px; cursor: pointer; border-radius: 14px; transition: all .2s;
  }
  .sync button:hover { background: rgba(255,255,255,0.2); }

  .hero h1 {
    font-family: var(--font-heading);
    font-size: 1.9rem;
    font-weight: 600;
    margin-top: 22px;
    position: relative; z-index: 1;
  }

  .error-banner {
    display: none;
    margin: 16px 48px 0;
    background: #fff4ec;
    border: 1px solid #f2c9a6;
    color: #8a4b1c;
    padding: 14px 18px;
    border-radius: 4px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
  .error-banner a { color: var(--abn-teal); font-weight: 600; }

  /* ---------- Ring section ---------- */
  .ring-section {
    max-width: 1120px;
    margin: 32px auto 0;
    padding: 0 48px;
  }
  .ring-panel {
    background: white;
    border-radius: 8px;
    padding: 36px 44px;
    box-shadow: 0 4px 18px rgba(0,73,116,0.08);
    display: flex;
    align-items: center;
    gap: 48px;
  }
  .ring-panel h2 {
    font-family: var(--font-heading);
    font-size: 1rem;
    font-weight: 600;
    color: var(--abn-navy);
    margin-bottom: 16px;
  }
  .ring-svg { width: 320px; height: 320px; flex-shrink: 0; }
  .ring-center-num { font-family: var(--font-heading); font-size: 2.6rem; font-weight: 700; fill: var(--abn-navy); }
  .ring-center-lbl { font-family: var(--font-body); font-size: 0.8rem; fill: var(--abn-muted); letter-spacing: 1px; }
  .ring-slice { cursor: pointer; transition: opacity .15s; }
  .ring-slice:hover { opacity: 0.82; }
  .ring-slice.dim { opacity: 0.2; }

  .legend-col { flex: 1; min-width: 0; }
  .legend {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 22px;
    max-height: 300px;
    overflow-y: auto;
  }
  .legend-item {
    display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 9px;
    font-size: 0.83rem; cursor: pointer; padding: 6px 8px; border-radius: 4px;
  }
  .legend-item:hover { background: #f2f8fa; }
  .legend-item.active { background: #eef7f4; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-name { color: var(--abn-navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-pct { color: var(--abn-muted); font-size: 0.76rem; }
  .legend-count { font-family: var(--font-heading); font-weight: 600; color: var(--abn-navy); min-width: 22px; text-align: right; }
  .clear-link {
    font-size: 0.68rem; font-weight: 600; color: var(--abn-teal); cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.5px; border: none; background: none; font-family: var(--font-heading);
    margin-left: 8px;
  }

  /* ---------- Companies section ---------- */
  .companies-section { padding: 34px 48px 48px; }
  .controls { margin-bottom: 8px; }
  .controls input[type="text"] {
    width: 100%;
    max-width: 420px;
    padding: 11px 14px;
    border: 1.5px solid #dde8ec;
    border-radius: 3px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--abn-navy);
    outline: none;
    background: white;
  }
  .controls input[type="text"]:focus { border-color: var(--abn-teal); }
  .results-meta { font-size: 0.75rem; color: var(--abn-muted); margin-bottom: 18px; }

  /* ---------- Country cards ---------- */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  .country-card {
    background: white;
    border-radius: 6px;
    box-shadow: 0 2px 10px rgba(0,73,116,0.06);
    display: flex;
    flex-direction: column;
    max-height: 380px;
    overflow: hidden;
    border-top: 3px solid transparent;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px;
    background: #fafbfc;
    border-bottom: 1px solid #eef1f3;
    flex-shrink: 0;
  }
  .card-title { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .card-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .card-name { font-family: var(--font-heading); font-size: 0.9rem; font-weight: 600; color: #1c3a4a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-count { font-family: var(--font-heading); font-size: 0.72rem; font-weight: 600; color: #5b7480; background: #eef2f4; padding: 2px 9px; border-radius: 10px; flex-shrink: 0; }

  .card-body { overflow-y: auto; flex: 1; }
  .company-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-bottom: 1px solid #f3f7f8;
    font-size: 0.82rem;
  }
  .company-row:last-child { border-bottom: none; }
  .company-row:hover { background: #fafcfd; }
  .company-name { color: var(--abn-navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .company-status { font-size: 0.68rem; color: var(--abn-muted); white-space: nowrap; }

  .badge {
    display: inline-block;
    font-family: var(--font-heading);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .badge.closed { color: var(--abn-gray); }

  /* ---------- Source tags ---------- */
  .company-row { grid-template-columns: 1fr auto auto auto auto; }
  .company-country { color: var(--abn-muted); font-size: 0.7rem; }
  .closed-card .company-name { color: var(--abn-muted); }
  .days-tag { font-size: 0.66rem; white-space: nowrap; padding: 1px 6px; border-radius: 8px; }
  .days-tag.ok { color: #2e8b57; background: #eaf7ef; }
  .days-tag.soon { color: #c77700; background: #fff3e0; }
  .days-tag.late { color: #d64545; background: #fdecec; }
  .days-tag.none { color: var(--abn-gray); }
  .src-tag {
    font-family: var(--font-body); font-size: 0.66rem; font-weight: 400;
    padding: 2px 7px; border-radius: 9px; white-space: nowrap;
  }
  .src-tag.yeganeh { background: #fff0f4; color: #c9567c; }
  .src-tag.olivier { background: #f3f1fe; color: #6f63c9; }
  .src-tag.unknown { background: #f2f2f2; color: #9a9a9a; }

  /* ---------- Source section ---------- */
  .source-section { max-width: 1120px; margin: 24px auto 0; padding: 0 48px; }
  .source-panel {
    background: white; border-radius: 8px; box-shadow: 0 4px 18px rgba(0,73,116,0.08);
    padding: 36px 44px; display: grid; grid-template-columns: 280px 1fr; gap: 40px; align-items: start;
  }
  .source-panel h2 { font-family: var(--font-heading); font-size: 1rem; color: var(--abn-navy); margin: 0 0 14px; }
  .source-ring { width: 200px; height: 200px; }
  .source-legend { margin-top: 14px; font-size: 0.8rem; }
  .source-legend div { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; padding: 4px 0; color: var(--abn-navy); white-space: nowrap; }
  .source-legend .sw { width: 10px; height: 10px; border-radius: 3px; }
  .source-legend .v { font-family: var(--font-heading); font-weight: 600; font-size: 0.76rem; }
  .camp-row { display: grid; grid-template-columns: 210px 1fr 90px; gap: 12px; align-items: center; padding: 5px 0; font-size: 0.82rem; }
  .camp-name { color: var(--abn-navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .camp-bar { background: #eef4f6; border-radius: 3px; height: 12px; overflow: hidden; }
  .camp-bar span { display: block; height: 100%; border-radius: 3px; }
  .camp-val { text-align: right; color: var(--abn-muted); font-size: 0.76rem; }
  .camp-val b { color: var(--abn-navy); font-family: var(--font-heading); }
  .camp-sub { font-size: 0.74rem; color: var(--abn-muted); padding: 1px 0 1px 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .camp-sub-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; opacity: .7; }
  .camp-sub-v { color: var(--abn-navy); }
  .camp-sub-kw { color: var(--abn-muted); font-size: 0.7rem; margin-left: 4px; }
  .camp-sub:last-of-type { margin-bottom: 4px; }
  .camp-note { font-size: 0.72rem; color: var(--abn-muted); margin-top: 10px; }
  @media (max-width: 760px) {
    .source-section { padding: 0 16px; }
    .source-panel { grid-template-columns: 1fr; }
    .camp-row { grid-template-columns: 120px 1fr 70px; }
  }

  /* ---------- Pipeline section ---------- */
  .pipe-section { max-width: 1120px; margin: 24px auto 0; padding: 0 48px; }
  .pipe-panel { background: white; border-radius: 8px; box-shadow: 0 4px 18px rgba(0,73,116,0.08); padding: 32px 44px; }
  .pipe-panel h2 { font-family: var(--font-heading); font-size: 1rem; color: var(--abn-navy); margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; }
  .pipe-btn { font-family: var(--font-body); font-size: 0.78rem; border: 1px solid #dde8ec; background: white; color: var(--abn-navy); border-radius: 14px; padding: 5px 12px; cursor: pointer; }
  .pipe-btn.primary { background: #6c5ce7; border-color: #6c5ce7; color: white; }
  .pipe-muted { color: var(--abn-muted); font-size: 0.78rem; }
  .pipe-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .pipe-stat { border-radius: 8px; padding: 7px 12px; min-width: 100px; }
  .pipe-stat b { display: block; font-family: var(--font-heading); font-size: 1.05rem; }
  .pipe-stat span { font-size: 0.7rem; }
  .pipe-stat.total { background: #eef4ff; color: #3b5bdb; }
  .pipe-stat.auto { background: #fff0f4; color: #c9567c; }
  .pipe-stat.manual { background: #f3f1fe; color: #6f63c9; }
  .pipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; }
  .pipe-tile { border-radius: 6px; padding: 7px 10px; background: #fafbfd; border-left: 4px solid #c9cfd3; }
  .pipe-tile.yeganeh { border-left-color: #ff6b9a; background: #fff7fa; }
  .pipe-tile.olivier { border-left-color: #6c5ce7; background: #f8f7ff; }
  .pipe-tile-name { color: var(--abn-navy); font-weight: 500; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pipe-tile-meta { font-size: 0.7rem; color: var(--abn-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 760px) {
    .pipe-section { padding: 0 16px; }
    .pipe-panel { padding: 24px 18px; }
  }

  .empty-state { padding: 40px 20px; text-align: center; color: var(--abn-muted); font-size: 0.88rem; grid-column: 1 / -1; }


  /* ---------- Report modal ---------- */
  .rep-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .rep-overlay.open { display: flex; }
  .rep-box { background: #fff; border-radius: 14px; width: min(780px, 100%); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .rep-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #eef2f4; flex-wrap: wrap; }
  .rep-bar h3 { margin: 0 auto 0 0; font-family: var(--font-heading); font-size: 1rem; color: var(--abn-navy); }
  .rep-bar select, .rep-bar button { font-family: var(--font-body); font-size: .82rem; border-radius: 8px; padding: 7px 12px; border: 1px solid #d5dee3; background: #fff; color: var(--abn-navy); cursor: pointer; }
  .rep-bar .rep-send { background: #ec4899; border-color: #ec4899; color: #fff; }
  .rep-bar .rep-send:hover { background: #db2777; }
  .rep-frame { border: 0; width: 100%; flex: 1; min-height: 70vh; background: #f1f5f9; }
</style>
</head>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4ItEeBnMWOdtZBypAhi6-v7bMXtQ0w8IBhzaohzhA0nAS4iue_pu84i1K8ePQBkdG/exec";
const REFRESH_MS = 60000;

const PHASE_MAP = { "1": 0, "6": 1, "16": 2, "24": 3, "52": 4 };
const PHASE_COLORS = ["var(--phase-0)","var(--phase-1)","var(--phase-2)","var(--phase-3)","var(--phase-4)"];

// Vivid, maximally-distinct colors for the ring/legend/cards — generated rather than
// drawn from the brand palette, since brand teals are too close in hue to tell 20+
// countries apart at a glance. Golden-angle hue spacing keeps every slice visually distinct
// no matter how many countries are in the sheet.
function countryColor(index) {
  const hue = (index * 137.508) % 360;
  const sat = 68;
  const light = index % 2 === 0 ? 50 : 58;
  return `hsl(${hue.toFixed(1)}, ${sat}%, ${light}%)`;
}

let allRows = [];
let filters = { country: null, search: "" };

function weeksToPhase(raw) {
  if (!raw) return null;
  const m = String(raw).match(/\d+/);
  if (!m) return null;
  return PHASE_MAP.hasOwnProperty(m[0]) ? PHASE_MAP[m[0]] : null;
}

// Google's gviz endpoint doesn't send CORS headers, so plain fetch() is blocked by the
// browser regardless of sharing settings. Loading it as a <script> tag (JSONP) sidesteps
// CORS entirely, which is how this endpoint is meant to be used.
function loadJsonp(url, timeoutMs = 12000) {
  return new Promise((resolve, reject) => {
    const cbName = "sheetCb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let done = false;

    const cleanup = () => {
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    };

    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error("Timed out waiting for the sheet data"));
    }, timeoutMs);

    window[cbName] = (data) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      resolve(data);
    };

    script.onerror = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      cleanup();
      reject(new Error("Could not reach the data source"));
    };

    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cbName + "&_=" + Date.now();
    document.head.appendChild(script);
  });
}

async function fetchSheet() {
  setSyncState("syncing");
  try {
    const data = await loadJsonp(APPS_SCRIPT_URL);
    if (data && data.status === "error") {
      if (data.message === "unauthorized") {
        try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
        allRows = []; render();
        throw new Error("You're not authorized to view this dashboard. Contact Yeganeh if this seems wrong.");
      }
      throw new Error(data.message || "Unknown error loading data");
    }
    const rows = parseRows(data.rows || []);
    if (rows.length) {
      allRows = rows;
      window.__rawRows = data.rows;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(data.rows)); } catch (e) {}
      setSyncState("live");
      hideError();
      render();
      return;
    }
    throw new Error("Sheet loaded but no rows with 'Company' and 'Country' headers were found on this tab");
  } catch (e) {
    setSyncState("error");
    showError(e);
  }
}

function calcDaysLeft(daysVal) {
  const n = parseInt(String(daysVal ?? "").replace(/[^\d-]/g, ""), 10);
  return isNaN(n) ? null : n;
}
function daysBadge(n) {
  if (n === null || n === undefined) return `<span class="days-tag none">—</span>`;
  if (n < 0) return `<span class="days-tag late" title="Follow-up overdue">${-n}d overdue</span>`;
  if (n === 0) return `<span class="days-tag soon">Due today</span>`;
  return `<span class="days-tag ${n <= 14 ? "soon" : "ok"}" title="Days until follow-up">${n}d left</span>`;
}

function parseRows(rawRows) {
  const norm = s => String(s).trim().toLowerCase();

  let headerIdx = -1, headerCells = null;
  for (let i = 0; i < rawRows.length; i++) {
    const cells = rawRows[i].map(v => norm(v));
    if (cells.includes("company") && cells.includes("country")) {
      headerIdx = i; headerCells = cells; break;
    }
  }
  if (headerIdx === -1) return [];

  const idx = {
    company: headerCells.indexOf("company"),
    country: headerCells.indexOf("country"),
    weeks: headerCells.findIndex(c => c.startsWith("follow-up") && c.includes("week")),
    status: headerCells.indexOf("status"),
    source: headerCells.indexOf("source"),
    campaign: headerCells.findIndex(c => c.startsWith("campaign")),
    liSource: headerCells.findIndex(c => c.startsWith("leadinfo source")),
    fuDate: headerCells.findIndex(c => c.startsWith("follow-up") && c.includes("date")),
    daysDue: headerCells.findIndex(c => c.startsWith("days until"))
  };

  const out = [];
  for (let i = headerIdx + 1; i < rawRows.length; i++) {
    const row = rawRows[i];
    const company = idx.company >= 0 ? String(row[idx.company] || "").trim() : "";
    const country = idx.country >= 0 ? String(row[idx.country] || "").trim() : "";
    if (!company) continue;
    if (!country) continue; // no country filled in yet — leave out until the sheet is updated
    const weeksRaw = idx.weeks >= 0 ? row[idx.weeks] : "";
    const status = idx.status >= 0 ? String(row[idx.status] || "").trim() : "";
    const phase = weeksToPhase(weeksRaw);
    const srcRaw = idx.source >= 0 ? String(row[idx.source] || "").trim().toLowerCase() : "";
    const source = srcRaw.startsWith("yeganeh") ? "Yeganeh" : srcRaw.startsWith("olivier") ? "Olivier" : "";
    const campaign = idx.campaign >= 0 ? String(row[idx.campaign] || "").trim() : "";
    const liSource = idx.liSource >= 0 ? String(row[idx.liSource] || "").trim() : "";
    const daysLeft = calcDaysLeft(idx.daysDue >= 0 ? row[idx.daysDue] : "");
    out.push({ company, country, phase, status: status || "—", source, campaign, liSource, daysLeft });
  }
  return dedupeByCompany(out);
}

// Same company can appear more than once (different contacts, follow-ups, etc).
// Keep exactly one entry per company so counts per country aren't inflated —
// preferring the most "alive" record: Active > Open > Closed, then the most
// urgent (lowest) phase if there's still a tie.
const STATUS_RANK = { "Active": 0, "Open": 1, "Closed": 2 };
function isBetterEntry(a, b) {
  const ra = STATUS_RANK.hasOwnProperty(a.status) ? STATUS_RANK[a.status] : 3;
  const rb = STATUS_RANK.hasOwnProperty(b.status) ? STATUS_RANK[b.status] : 3;
  if (ra !== rb) return ra < rb;
  const pa = a.phase === null ? 99 : a.phase;
  const pb = b.phase === null ? 99 : b.phase;
  return pa < pb;
}
function dedupeByCompany(rows) {
  const best = new Map(); // normalized company name -> best row
  const order = [];
  rows.forEach(r => {
    const key = r.company.trim().toLowerCase();
    if (!best.has(key)) {
      best.set(key, r);
      order.push(key);
    } else {
      const prev = best.get(key);
      const winner = isBetterEntry(r, prev) ? { ...r } : { ...prev };
      const yRow = [r, prev].find(x => x.source === "Yeganeh");
      if (yRow) { winner.source = "Yeganeh"; winner.campaign = winner.campaign || yRow.campaign; }
      else if (!winner.source) winner.source = r.source || prev.source;
      winner.liSource = winner.liSource || r.liSource || prev.liSource;
      best.set(key, winner);
    }
  });
  return order.map(key => best.get(key));
}

function setSyncState(state) {
  const dot = document.getElementById("syncDot");
  const label = document.getElementById("syncLabel");
  if (state === "syncing") { label.textContent = "Syncing…"; dot.style.background = "var(--abn-cyan)"; }
  else if (state === "live") { label.textContent = "Live"; dot.style.background = "var(--abn-cyan)"; }
  else { label.textContent = "Connection issue"; dot.style.background = "#e08a3c"; }
}

function showError(err) {
  const el = document.getElementById("errorBanner");
  el.style.display = "block";
  const reason = err ? err.message : "Unknown error";
  el.innerHTML = "<strong>Could not load the data:</strong> " + escapeHtml(reason) + "<br>" +
    "If this says you're not authorized, make sure you're signed into a Google account approved for this dashboard, then hit Refresh.";
}
function hideError() { document.getElementById("errorBanner").style.display = "none"; }

function getCountryCounts() {
  const counts = {};
  allRows.forEach(r => { counts[r.country] = (counts[r.country] || 0) + 1; });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function render() {
  renderRing();
  renderSource();
  renderPipeline();
  renderCards();
}

let fbAuth = null, projectsRef = null;
const ALLOWED_DOMAIN = "abn-cleanroomtechnology.com";
const STAGE_LABELS = { active: "Active Now", closing: "Closing This Year", progress: "Won" };
let pipelineProjects = null;
function fmtMoney(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return "€" + (Math.round(n / 1e4) / 100) + "M";
  if (n >= 1e3) return "€" + (Math.round(n / 100) / 10) + "K";
  return "€" + Math.round(n);
}

const COMPANY_NOISE = new Set(["gmbh","bv","nv","sa","sas","srl","ltd","limited","ag","inc","ab","oy","as","spa","group","the","co","company","sl","plc"]);
function companyTokens(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().split(" ")
    .filter(t => t && !COMPANY_NOISE.has(t));
}
function findLead(name) {
  const a = companyTokens(name);
  if (!a.length) return null;
  const exact = allRows.find(r => companyTokens(r.company).join(" ") === a.join(" "));
  if (exact) return exact;
  // whole-word prefix match only, e.g. "Kreios Space" = "Kreios Space Europe"
  return allRows.find(r => {
    const b = companyTokens(r.company);
    if (!b.length) return false;
    const [short, long] = a.length <= b.length ? [a, b] : [b, a];
    return short.join("").length >= 4 && short.every((t, i) => long[i] === t);
  }) || null;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src; el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}
async function initPipeline() {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  await loadScript(base + "firebase-app-compat.js");
  await Promise.all([loadScript(base + "firebase-database-compat.js"), loadScript(base + "firebase-auth-compat.js")]);
  firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth = firebase.auth();
  projectsRef = firebase.database().ref("projects");
  fbAuth.onAuthStateChanged(onPipelineAuth);
}
window.addEventListener("load", () => { initPipeline().catch(e => renderPipeline(e)); });

function onPipelineAuth(user) {
  if (user && (user.email || "").toLowerCase().endsWith("@" + ALLOWED_DOMAIN)) {
    projectsRef.on("value", snap => {
      const val = snap.val() || {};
      pipelineProjects = Object.entries(val).map(([id, p]) => ({ id, ...p }));
      renderPipeline();
    }, err => { pipelineProjects = null; renderPipeline(err); });
  } else {
    if (user) fbAuth.signOut();
    pipelineProjects = null;
    renderPipeline();
  }
}

function renderPipeline(err) {
  const auth = document.getElementById("pipeAuth");
  const body = document.getElementById("pipeBody");
  if (!fbAuth) {
    auth.innerHTML = "";
    body.innerHTML = `<div class="pipe-muted">${err ? escapeHtml(err.message) : "Loading…"}</div>`;
    return;
  }
  const user = fbAuth.currentUser;
  if (!user) {
    auth.innerHTML = "";
    body.innerHTML = `<button class="pipe-btn primary" id="pipeSignIn">Sign in with Google</button>
      ${err ? `<div class="pipe-muted" style="margin-top:8px">${escapeHtml(err.message)}</div>` : ""}`;
    document.getElementById("pipeSignIn").onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ hd: ALLOWED_DOMAIN });
      fbAuth.signInWithPopup(provider).catch(e => renderPipeline(e));
    };
    return;
  }
  auth.innerHTML = `<button class="pipe-btn" id="pipeSignOut">Sign out</button>`;
  document.getElementById("pipeSignOut").onclick = () => fbAuth.signOut();
  if (!pipelineProjects) { body.innerHTML = `<div class="pipe-muted">Loading…</div>`; return; }
  if (!pipelineProjects.length) { body.innerHTML = `<div class="pipe-muted">No projects in the pipeline.</div>`; return; }

  const matched = pipelineProjects
    .map(p => ({ p, lead: findLead(p.name) }))
    .filter(x => x.lead);
  if (!matched.length) { body.innerHTML = `<div class="pipe-muted">No pipeline clients found in the lead list.</div>`; return; }
  const nAuto = matched.filter(x => x.lead.source === "Yeganeh").length;
  const nManual = matched.filter(x => x.lead.source === "Olivier").length;
  body.innerHTML = `
    <div class="pipe-stats">
      <div class="pipe-stat total"><b>${matched.length}</b><span>Pipeline clients from lead list</span></div>
      <div class="pipe-stat auto"><b>${nAuto}</b><span>Automated activities</span></div>
      <div class="pipe-stat manual"><b>${nManual}</b><span>Olivier's manual activities</span></div>
    </div>
    <div class="pipe-grid">${matched.map(({ p, lead }) => {
      const src = lead.source || "—";
      return `<div class="pipe-tile ${(lead.source || "").toLowerCase()}">
        <div class="pipe-tile-name" title="${escapeAttr(p.name || "")}">${escapeHtml(p.name || "Unnamed")}</div>
        <div class="pipe-tile-meta">${escapeHtml(STAGE_LABELS[p.status] || p.status || "")} · ${escapeHtml(src)}</div>
        <div class="pipe-tile-meta">${fmtMoney(p.amount)}${p.winProb != null && p.winProb !== "" ? " · " + escapeHtml(String(p.winProb)) + "% chance" : ""}</div>
      </div>`;
    }).join("")}</div>`;
}

/* ---------- Lead source ---------- */
function campaignGroup(name) {
  const n = name.toLowerCase();
  if (n.startsWith("quantum")) return "Quantum, PHOTONICS";
  if (n.startsWith("scrapelist")) return "LeadGen";
  if (n.startsWith("archived sequence") || n === "manual email" || n.startsWith("htce")) return "Other campaigns";
  return name;
}
function liCategory(v) {
  const s = (v || "").toLowerCase();
  if (!s) return "";
  if (s.includes("crunchbase")) return "Crunchbase";
  if (s.includes("blog") || /[-–—]\s*ga\s*$/.test(s)) return "Blog post";
  if (s.startsWith("direct")) return "Direct";
  if (s.includes("organic")) return "Organic";
  if (s.includes("google ads")) return "Google Ads";
  return "Other";
}
function liBreakdownHtml(rows, color) {
  const lc = rows.filter(x => /leadinfo/i.test(x.campaign || ""));
  if (!lc.length) return "";
  const cb = lc.filter(x => liCategory(x.liSource) === "Crunchbase").length;
  const liRows = lc.filter(x => liCategory(x.liSource) !== "Crunchbase");
  const kw = {};
  liRows.forEach(x => { const k = liCategory(x.liSource) || "Not found"; kw[k] = (kw[k] || 0) + 1; });
  const kwTxt = Object.entries(kw).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${escapeHtml(k)} ${n}`).join(" · ");
  const pct = n => (n / lc.length * 100).toFixed(0);
  return `<div class="camp-sub"><span class="camp-sub-dot" style="background:${color}"></span>Crunchbase <span class="camp-sub-v">${pct(cb)}% · ${cb}</span></div>
    <div class="camp-sub"><span class="camp-sub-dot" style="background:${color}"></span>Leadinfo <span class="camp-sub-v">${pct(liRows.length)}% · ${liRows.length}</span>
      <span class="camp-sub-kw">${kwTxt}</span></div>`;
}
const SOURCE_LABELS = { Yeganeh: "Automated activities", Olivier: "Olivier's manual activities", Unassigned: "Unassigned" };
const SOURCE_COLORS = { Yeganeh: "#ff6b9a", Olivier: "#6c5ce7", Unassigned: "#c9cfd3" };
function renderSource() {
  const rows = filters.country ? allRows.filter(r => r.country === filters.country) : allRows;
  const total = rows.length;
  const counts = { Yeganeh: 0, Olivier: 0, Unassigned: 0 };
  rows.forEach(r => { counts[r.source || "Unassigned"]++; });

  const svg = document.getElementById("sourceRing");
  const cx = 100, cy = 100, r = 80, strokeW = 28, circ = 2 * Math.PI * r;
  let offset = 0, slices = "";
  Object.entries(counts).forEach(([name, n]) => {
    if (!n) return;
    const dash = n / total * circ;
    slices += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${SOURCE_COLORS[name]}" stroke-width="${strokeW}"
      stroke-dasharray="${dash} ${circ - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})">
      <title>${SOURCE_LABELS[name]}: ${n} (${(n / total * 100).toFixed(1)}%)</title></circle>`;
    offset += dash;
  });
  const yPct = total ? Math.round(counts.Yeganeh / total * 100) : 0;
  svg.innerHTML = slices +
    `<text x="${cx}" y="${cy - 4}" text-anchor="middle" class="ring-center-num">${yPct}%</text>
     <text x="${cx}" y="${cy + 16}" text-anchor="middle" class="ring-center-lbl">CAMPAIGNS</text>`;

  document.getElementById("sourceLegend").innerHTML = Object.entries(counts)
    .filter(([name, n]) => n || name !== "Unassigned")
    .map(([name, n]) => `<div><span class="sw" style="background:${SOURCE_COLORS[name]}"></span>${SOURCE_LABELS[name]}
      <span class="v">${n} · ${total ? (n / total * 100).toFixed(1) : "0.0"}%</span></div>`).join("");

  const yRows = rows.filter(x => x.source === "Yeganeh");
  const camp = {};
  yRows.forEach(x => {
    const parts = x.campaign
      ? x.campaign.replace(/Leadinfo \+ Crunchbase/gi, "Leadinfo & Crunchbase").split(" + ")
          .map(p => p.trim().replace("Leadinfo & Crunchbase", "Leadinfo + Crunchbase")
            .replace(/\s*[-–—]\s*(EN|NL|FR|DE)\s*$/i, "").replace(/\s+/g, " ").trim())
          .filter(Boolean).map(campaignGroup)
      : [];
    [...new Set(parts)].forEach(p => { camp[p] = (camp[p] || 0) + 1; });
  });
  const sortedCamp = Object.entries(camp).sort((a, b) => b[1] - a[1]);
  const max = sortedCamp.length ? sortedCamp[0][1] : 1;
  document.getElementById("campaignBars").innerHTML = sortedCamp.length
    ? sortedCamp.map(([name, n], i) => {
        const pct = yRows.length ? n / yRows.length * 100 : 0;
        return `<div class="camp-row">
          <span class="camp-name" title="${escapeAttr(name)}">${escapeHtml(name)}</span>
          <span class="camp-bar"><span style="width:${(n / max * 100).toFixed(1)}%;background:${countryColor(i)}"></span></span>
          <span class="camp-val"><b>${pct.toFixed(1)}%</b> · ${n}</span>
        </div>${name === "Leadinfo + Crunchbase" ? liBreakdownHtml(yRows, countryColor(i)) : ""}`;
      }).join("")
    : `<div class="camp-note">No Yeganeh leads${filters.country ? " in " + escapeHtml(filters.country) : ""}.</div>`;
}

/* ---------- Ring chart ---------- */
function renderRing() {
  const sorted = getCountryCounts();
  const total = allRows.length;
  const svg = document.getElementById("ringSvg");
  const cx = 100, cy = 100, r = 80, strokeW = 28;
  const circumference = 2 * Math.PI * r;

  let offset = 0;
  let slices = "";
  sorted.forEach(([country, count], i) => {
    const frac = total ? count / total : 0;
    const dash = frac * circumference;
    const gap = circumference - dash;
    const color = countryColor(i);
    const dimClass = (filters.country && filters.country !== country) ? "dim" : "";
    slices += `<circle class="ring-slice ${dimClass}" data-country="${escapeAttr(country)}"
      cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeW}"
      stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${cx} ${cy})"><title>${escapeHtml(country)}: ${count} (${(frac*100).toFixed(1)}%)</title></circle>`;
    offset += dash;
  });

  svg.innerHTML = slices +
    `<text x="${cx}" y="${cy - 4}" text-anchor="middle" class="ring-center-num">${total}</text>
     <text x="${cx}" y="${cy + 16}" text-anchor="middle" class="ring-center-lbl">LEADS</text>`;

  svg.querySelectorAll(".ring-slice").forEach(el => {
    el.addEventListener("click", () => {
      const country = el.dataset.country;
      filters.country = filters.country === country ? null : country;
      render();
    });
  });

  renderLegend(sorted, total);
}

function renderLegend(sorted, total) {
  const el = document.getElementById("legend");
  el.innerHTML = "";
  sorted.forEach(([country, count], i) => {
    const pct = total ? (count / total * 100).toFixed(1) : "0.0";
    const item = document.createElement("div");
    item.className = "legend-item" + (filters.country === country ? " active" : "");
    item.innerHTML = `
      <span class="legend-swatch" style="background:${countryColor(i)}"></span>
      <span class="legend-name" title="${country}">${country}</span>
      <span class="legend-pct">${pct}%</span>
      <span class="legend-count">${count}</span>
    `;
    item.addEventListener("click", () => {
      filters.country = filters.country === country ? null : country;
      render();
    });
    el.appendChild(item);
  });
  document.getElementById("clearCountry").style.display = filters.country ? "inline" : "none";
}

/* ---------- Country cards ---------- */
function isClosed(r) { return String(r.status || "").trim().toLowerCase() === "closed"; }
function companyRowHtml(r, extra) {
  const phaseBadge = r.phase !== null
    ? `<span class="badge" style="color:${PHASE_COLORS[r.phase]}">Phase ${r.phase}</span>`
    : `<span class="badge closed">—</span>`;
  return `<div class="company-row">
    <span class="company-name" title="${escapeAttr(r.company)}">${escapeHtml(r.company)}${extra ? ` <span class="company-country">· ${escapeHtml(extra)}</span>` : ""}</span>
    ${r.source
      ? `<span class="src-tag ${r.source.toLowerCase()}" title="${escapeAttr(r.campaign || r.source)}">${r.source}</span>`
      : `<span class="src-tag unknown">—</span>`}
    <span class="company-status">${escapeHtml(r.status)}</span>
    ${phaseBadge}
    ${daysBadge(r.daysLeft)}
  </div>`;
}
function renderCards() {
  const sorted = getCountryCounts();
  const search = filters.search.toLowerCase();
  const container = document.getElementById("cardGrid");
  container.innerHTML = "";

  const visibleCountries = sorted.filter(([country]) => !filters.country || country === filters.country);
  let totalVisible = 0;
  let countriesShown = 0;

  visibleCountries.forEach(([country], i) => {
    const countryMatches = !search || country.toLowerCase().includes(search);
    const companies = allRows.filter(r =>
      r.country === country && !isClosed(r) && (countryMatches || r.company.toLowerCase().includes(search))
    );
    if (!companies.length) return;
    totalVisible += companies.length;
    countriesShown += 1;

    const card = document.createElement("div");
    card.className = "country-card";
    const cColor = countryColor(sorted.findIndex(([c]) => c === country));
    card.style.borderTopColor = cColor;
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">
          <span class="card-swatch" style="background:${cColor}"></span>
          <span class="card-name" title="${escapeAttr(country)}">${escapeHtml(country)}</span>
        </div>
        <span class="card-count">${companies.length}</span>
      </div>
      <div class="card-body">
        ${companies.map(r => companyRowHtml(r)).join("")}
      </div>
    `;
    container.appendChild(card);
  });

  const closedRows = allRows.filter(r => isClosed(r) && (!filters.country || r.country === filters.country) &&
    (!search || r.company.toLowerCase().includes(search) || r.country.toLowerCase().includes(search)));
  if (closedRows.length) {
    totalVisible += closedRows.length;
    const card = document.createElement("div");
    card.className = "country-card closed-card";
    card.style.borderTopColor = "#9aa5ab";
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">
          <span class="card-swatch" style="background:#9aa5ab"></span>
          <span class="card-name">Closed</span>
        </div>
        <span class="card-count">${closedRows.length}</span>
      </div>
      <div class="card-body">${closedRows.map(r => companyRowHtml(r, r.country)).join("")}</div>`;
    container.appendChild(card);
  }

  document.getElementById("resultsMeta").textContent =
    filters.country
      ? `${totalVisible} companies in ${filters.country}`
      : `${totalVisible} of ${allRows.length} companies across ${countriesShown} countries`;

  if (!countriesShown && !closedRows.length) {
    container.innerHTML = `<div class="empty-state">No companies match these filters.</div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

document.getElementById("clearCountry").addEventListener("click", () => { filters.country = null; render(); });
document.getElementById("searchBox").addEventListener("input", e => { filters.search = e.target.value; renderCards(); });
document.getElementById("refreshBtn").addEventListener("click", fetchSheet);

const CACHE_KEY = "abnLeadRowsCache";
try {
  const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
  if (cached) { window.__rawRows = cached; allRows = parseRows(cached); if (allRows.length) render(); }
} catch (e) {}
fetchSheet();
setInterval(fetchSheet, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchSheet(); });
</script>


<script>
/* ---------- Monthly report (same logic & design as the email) ---------- */
const REPORT_SEND_URL = "https://script.google.com/macros/s/AKfycbzmSGue0H8BoFVD6t4rn7uNc5Fji1w3DKd5QQ1JUEV6DUyG10XEkBH7PZmSMyCEhkjVFQ/exec";
const Utilities = { formatDate: d => d.toLocaleString("en-GB", { month: "long", year: "numeric" }) };
const Session = { getScriptTimeZone: () => "" };
/* ---------- data ---------- */
function parseDate_(v) {
  if (v instanceof Date && !isNaN(v)) return v;
  var s = String(v || "").trim();
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  if (/^\d{4}-\d{2}-\d{2}T/.test(s) && !isNaN(Date.parse(s))) return new Date(s);
  return null;
}

/* Lead sources: from the "Leadinfo Source" column, else Yeganeh = Campaigns, Olivier = Manual. */
var SOURCE_ORDER_ = ["Crunchbase", "Google Ads", "Blog post", "Campaigns", "Direct & Organic", "Manual"];
var SOURCE_COLORS_ = { "Crunchbase": "#dc2626", "Google Ads": "#22c55e", "Blog post": "#f97316", "Campaigns": "#ec4899",
  "Direct & Organic": "#0ea5e9", "Manual": "#7c5ce6" };
function sourceCat_(e) {
  var li = String(e.li || "").toLowerCase();
  if (li.indexOf("crunchbase") >= 0) return "Crunchbase";
  if (li.indexOf("google ads") >= 0) return "Google Ads";
  if (li.indexOf("blog") >= 0 || /[-\u2013\u2014]\s*ga\s*$/.test(li)) return "Blog post";
  if (li.indexOf("direct") === 0 || li.indexOf("organic") >= 0) return "Direct & Organic";
  return e.source === "Yeganeh" ? "Campaigns" : "Manual";
}

function buildLeadReport_(rows, now) {
  var hi = -1, h = null;
  for (var i = 0; i < rows.length; i++) {
    var c = rows[i].map(function (x) { return String(x).trim().toLowerCase(); });
    if (c.indexOf("company") >= 0 && c.indexOf("country") >= 0) { hi = i; h = c; break; }
  }
  if (hi < 0) return null;
  var li = -1, cp = -1;
  for (var q = 0; q < h.length; q++) {
    if (li < 0 && h[q].indexOf("leadinfo source") === 0) li = q;
    if (cp < 0 && h[q].indexOf("campaign") === 0) cp = q;
  }
  var ix = { company: h.indexOf("company"), country: h.indexOf("country"), date: h.indexOf("date added"),
    status: h.indexOf("status"), source: h.indexOf("source"), li: li, cp: cp };

  // One entry per company: earliest date, Yeganeh wins, first filled lead source, closed only if every row is closed.
  var map = {};
  for (var j = hi + 1; j < rows.length; j++) {
    var row = rows[j];
    var company = String(row[ix.company] || "").trim(), country = String(row[ix.country] || "").trim();
    if (!company || !country) continue;
    var key = company.toLowerCase(), d = parseDate_(row[ix.date]);
    var src = String(row[ix.source] || "").trim().toLowerCase().indexOf("yeganeh") === 0 ? "Yeganeh" : "Olivier";
    var closed = String(row[ix.status] || "").trim().toLowerCase() === "closed";
    var lis = ix.li >= 0 ? String(row[ix.li] || "").trim() : "";
    var camp = ix.cp >= 0 ? String(row[ix.cp] || "").trim() : "";
    var e = map[key];
    if (!e) { map[key] = { country: country, date: d, source: src, closed: closed, li: lis, camp: camp }; continue; }
    if (d && (!e.date || d < e.date)) e.date = d;
    if (src === "Yeganeh") e.source = "Yeganeh";
    if (!closed) e.closed = false;
    if (!e.li) e.li = lis;
    if (!e.camp || (src === "Yeganeh" && camp)) e.camp = camp || e.camp;
  }

  var endCur = new Date(now.getFullYear(), now.getMonth(), 1);
  var endPrev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  var endPrev2 = new Date(now.getFullYear(), now.getMonth() - 2, 1);
  var countries = {}, t = { total: 0, prev: 0, newCur: 0, yNew: 0, oNew: 0 };
  Object.keys(map).forEach(function (k) {
    var e = map[k];
    if (e.closed || !e.date || e.date >= endCur) return;
    var c = countries[e.country] || (countries[e.country] = { name: e.country, total: 0, newCur: 0, yNew: 0, oNew: 0, src: {} });
    var cat = sourceCat_(e);
    c.total++; t.total++; c.src[cat] = (c.src[cat] || 0) + 1;
    if (e.date < endPrev) t.prev++;
    else { c.newCur++; t.newCur++; if (e.source === "Yeganeh") { c.yNew++; t.yNew++; } else { c.oNew++; t.oNew++; } }
  });
  var list = Object.keys(countries).map(function (k) { return countries[k]; })
    .sort(function (a, b) { return b.total - a.total || b.newCur - a.newCur; });
  return {
    monthLabel: Utilities.formatDate(endPrev, Session.getScriptTimeZone(), "MMMM yyyy"),
    prevLabel: Utilities.formatDate(endPrev2, Session.getScriptTimeZone(), "MMMM yyyy"),
    list: list, total: t.total, totalDelta: t.newCur, newCur: t.newCur, yNew: t.yNew, oNew: t.oNew
  };
}

/* ---------- email ---------- */
function fmtDelta_(n) { return n > 0 ? "+" + n : n < 0 ? "\u2212" + Math.abs(n) : "\u00b10"; }

function renderLeadReport_(r) {
  var font = "font-family:Segoe UI,Arial,sans-serif;";
  var th = "padding:8px 6px;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;";
  var td = "padding:9px 6px;font-size:14px;";
  var html = "<div style='background:#f1f5f9;padding:24px;" + font + "'><div style='max-width:680px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden'>" +
    "<div style='background:linear-gradient(135deg,#004974,#1893A5 55%,#00C7E5);padding:20px 24px;color:#fff'>" +
    "<div style='font-size:13px;opacity:.85'>ABN Lead Tracker \u00b7 Monthly report</div>" +
    "<div style='font-size:22px;font-weight:700'>" + r.monthLabel + "</div>" +
    "<div style='font-size:14px;margin-top:4px'><b>" + r.total + "</b> leads \u00b7 <b>+" + r.newCur + "</b> this month " +
    "(Yeganeh " + r.yNew + ", Olivier " + r.oNew + ")</div></div>";

  // 1. Leads per country + growth this month
  html += "<div style='padding:18px 24px 6px'><div style='font-size:16px;font-weight:700;color:#0f172a;margin-bottom:6px'>Leads per country</div>" +
    "<table style='width:100%;border-collapse:collapse;color:#334155'><tr>" +
    "<td style='" + th + "'>Country</td><td style='" + th + "text-align:right'>Leads</td>" +
    "<td style='" + th + "text-align:right'>New this month</td>" +
    "<td style='" + th + "text-align:right;color:#db2777'>Yeganeh</td>" +
    "<td style='" + th + "text-align:right;color:#6d28d9'>Olivier</td></tr>";
  r.list.forEach(function (c) {
    html += "<tr style='border-top:1px solid #f1f5f9'>" +
      "<td style='" + td + "font-weight:600;color:#0f172a'>" + c.name + "</td>" +
      "<td style='" + td + "text-align:right;font-weight:700;color:#0f172a'>" + c.total + "</td>" +
      "<td style='" + td + "text-align:right;color:" + (c.newCur ? "#15803d;font-weight:700" : "#94a3b8") + "'>" + (c.newCur ? "+" + c.newCur : "0") + "</td>" +
      "<td style='" + td + "text-align:right;color:#db2777'>" + (c.yNew || "\u2013") + "</td>" +
      "<td style='" + td + "text-align:right;color:#6d28d9'>" + (c.oNew || "\u2013") + "</td></tr>";
  });
  html += "<tr style='border-top:2px solid #e2e8f0'><td style='" + td + "font-weight:700'>Total</td>" +
    "<td style='" + td + "text-align:right;font-weight:700'>" + r.total + "</td>" +
    "<td style='" + td + "text-align:right;font-weight:700;color:#15803d'>+" + r.newCur + "</td>" +
    "<td style='" + td + "text-align:right;font-weight:700;color:#db2777'>" + r.yNew + "</td>" +
    "<td style='" + td + "text-align:right;font-weight:700;color:#6d28d9'>" + r.oNew + "</td></tr></table></div>";

  // 2. Lead sources per country
  html += "<div style='padding:18px 24px 24px'><div style='font-size:16px;font-weight:700;color:#0f172a;margin-bottom:6px'>Lead sources per country</div>" +
    "<table style='width:100%;border-collapse:collapse;color:#334155'><tr><td style='" + th + "'>Country</td>" +
    SOURCE_ORDER_.map(function (k) { return "<td style='" + th + "text-align:right;color:" + SOURCE_COLORS_[k] + "'>" + k + "</td>"; }).join("") + "</tr>";
  r.list.forEach(function (c) {
    html += "<tr style='border-top:1px solid #f1f5f9'><td style='" + td + "font-weight:600;color:#0f172a;white-space:nowrap'>" + c.name +
      " <span style='color:#94a3b8;font-weight:400;font-size:12px'>" + c.total + "</span></td>" +
      SOURCE_ORDER_.map(function (k) {
        return "<td style='" + td + "text-align:right;font-size:13px;color:" + (c.src[k] ? "#0f172a" : "#cbd5e1") + "'>" + (c.src[k] ? Math.round(c.src[k] / c.total * 100) + "%" : "\u2013") + "</td>";
      }).join("") + "</tr>";
  });
  html += "</table></div></div></div>";
  return html;
}
(function () {
  const ov = document.getElementById("repOverlay"), sel = document.getElementById("repMonth"), frame = document.getElementById("repFrame");
  const now = new Date();
  for (let i = 1; i <= 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const v = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    sel.add(new Option(d.toLocaleString("en-GB", { month: "long", year: "numeric" }), v));
  }
  function show() {
    const [y, m] = sel.value.split("-").map(Number);
    const r = buildLeadReport_(window.__rawRows || [], new Date(y, m, 1));
    frame.srcdoc = r ? "<!doctype html><meta charset='utf-8'><body style='margin:0'>" + renderLeadReport_(r) + "</body>"
                     : "<p style='font-family:sans-serif;padding:30px'>No data loaded yet — try again in a moment.</p>";
  }
  document.getElementById("reportBtn").addEventListener("click", () => { ov.classList.add("open"); show(); });
  sel.addEventListener("change", show);
  document.getElementById("repClose").addEventListener("click", () => ov.classList.remove("open"));
  ov.addEventListener("click", e => { if (e.target === ov) ov.classList.remove("open"); });
  document.getElementById("repSend").addEventListener("click", () => {
    window.open(REPORT_SEND_URL + "?month=" + encodeURIComponent(sel.value), "_blank");
  });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
